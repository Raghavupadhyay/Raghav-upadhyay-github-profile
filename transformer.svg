<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">

  <style>
    .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 10; }
    .text { fill: #e2e8f0; font-family: monospace; font-size: 14px; text-anchor: middle; }
    .arrow { stroke: #38bdf8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    
    .flow {
      stroke-dasharray: 6;
      animation: dash 2s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -12; }
    }
  </style>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="80" width="120" height="50" class="box"/>
  <text x="100" y="110" class="text">Input</text>

  <rect x="200" y="80" width="140" height="50" class="box"/>
  <text x="270" y="110" class="text">Embedding</text>

  <rect x="380" y="80" width="160" height="50" class="box"/>
  <text x="460" y="110" class="text">Self-Attention</text>

  <rect x="580" y="80" width="140" height="50" class="box"/>
  <text x="650" y="110" class="text">Output</text>

  <!-- Arrows -->
  <line x1="160" y1="105" x2="200" y2="105" class="arrow flow"/>
  <line x1="340" y1="105" x2="380" y2="105" class="arrow flow"/>
  <line x1="540" y1="105" x2="580" y2="105" class="arrow flow"/>

  <!-- Subtle attention lines -->
  <line x1="270" y1="80" x2="460" y2="80" stroke="#1e293b" stroke-width="1"/>
  <line x1="270" y1="130" x2="460" y2="130" stroke="#1e293b" stroke-width="1"/>

</svg>